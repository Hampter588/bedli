name: Build MCLI Bedrock

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install . "pyinstaller>=6.16,<7"
      - name: Build GDK helper
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ Build Tools not found" }
          $devcmd = Join-Path $vs "Common7\\Tools\\VsDevCmd.bat"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++20 /O2 /EHsc /DUNICODE /D_UNICODE native\\GDKDecryptHelper\\GDKDecryptHelper.cpp /Fe:native\\GDKDecryptHelper\\GDKDecryptHelper.exe /link /SUBSYSTEM:WINDOWS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/build_binary.py
      - run: dist\bedli.exe --help
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/bedli.exe package/bedli.exe
          Copy-Item native/GDKDecryptHelper/GDKDecryptHelper.exe package/GDKDecryptHelper.exe
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Compress-Archive package/* mcli-bedrock-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: mcli-bedrock-windows-x64
          path: mcli-bedrock-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mcli-bedrock-windows-x64.zip
