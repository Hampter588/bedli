name: Build BEDLI
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish BEDLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - run: publish\bedli.exe --help
      - shell: pwsh
        run: Compress-Archive publish/* bedli-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bedli-windows-x64
          path: bedli-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bedli-windows-x64.zip
