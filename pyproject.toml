[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcli-bedrock"
version = "0.1.0"
description = "Minecraft Bedrock command-line launcher and package manager for Windows"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
bedli = "mclib.cli:main"

[tool.setuptools.packages.find]
include = ["mclib*"]
